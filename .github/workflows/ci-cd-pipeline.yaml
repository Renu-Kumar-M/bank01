name: CI/CD Pipeline for Banking App
on:
  push:
    branches:
      - main
jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run automated tests
        run: |
          pytest test_app.py
      - name: Extract unique image tag
        id: meta
        run: |
          TAG="v-${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> $GITHUB_ENV
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/simple-banking-app:${{ env.TAG }}
            ${{ secrets.DOCKER_USERNAME }}/simple-banking-app:latest
      - name: Update Kubernetes deployment image tag
        run: |
          sed -i "s|image: .*/simple-banking-app:.*|image: ${{ secrets.DOCKER_USERNAME }}/simple-banking-app:${{ env.TAG }}|g" k8s/deployment.yaml
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
